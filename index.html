<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오후 반차</title>
<style>
/* ===== 성인판 팔레트: 라벤더 · 보라 · 차콜그레이 ===== */
:root{
  --bg:#2B2A33;           /* 폰 바깥 (차콜) */
  --bezel:#17161C;
  --screen:#F4F1FA;       /* 폰 화면 (라벤더 화이트) */
  --paper:#FFFFFF;
  --ink:#1E1C26; --sub:#6F6B84; --line:#DCD6EA;
  --accent:#6B4FBB;       /* 보라 */
  --lav:#E6DEF7;          /* 라벤더 */
  --charcoal:#3A3844;
  --bub:#FFFFFF; --me:#6B4FBB;
  --t-jiji:#B85C8A; --t-sago:#5B4FBB; --t-haeng:#4F8A6B; --t-gwan:#7A7A9C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}

/* ---- 폰 프레임 ---- */
.phone{width:390px;height:844px;margin:28px auto;background:var(--bezel);border-radius:48px;padding:12px;
  box-shadow:0 30px 60px rgba(0,0,0,.45);position:relative}
.screen{background:var(--screen);border-radius:38px;height:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.status .r{display:flex;align-items:center;gap:6px;color:var(--ink)}
.status svg{display:block}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:var(--bezel);border-radius:0 0 20px 20px}
.bar{height:2px;background:var(--line);margin:0 22px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}
.loc{display:flex;justify-content:space-between;align-items:center;margin:10px 16px 0;padding:10px 14px;
  background:var(--charcoal);color:#fff;border-radius:14px;font-size:14px;font-weight:700}
.loc .n{display:flex;align-items:center;gap:8px}
.loc .dot{width:9px;height:9px;border-radius:99px;background:var(--lav)}
.loc .t{font-weight:600;font-variant-numeric:tabular-nums;opacity:.75}
.loc .no{font-size:11.5px;opacity:.7;margin-left:8px;font-weight:600}
.loc[hidden]{display:none}
.view{flex:1;overflow-y:auto;padding:12px 16px 12px;-webkit-overflow-scrolling:touch}
.sheet{border-top:1px solid var(--line);background:var(--paper);padding:10px 14px 12px;max-height:46%;overflow-y:auto}
.sheet:empty{display:none}
.home{height:5px;width:120px;background:var(--bezel);border-radius:99px;margin:6px auto 4px}
@media(max-width:430px){
  body{background:var(--screen)}
  .phone{width:100%;height:100vh;height:100dvh;margin:0;border-radius:0;padding:0;box-shadow:none;background:var(--screen)}
  .screen{border-radius:0}
  .notch,.home{display:none}
  .status{padding-top:max(10px,env(safe-area-inset-top))}
  .sheet{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}

/* ---- 장소 타일 (공간이 바뀌면 새 대화방으로) ---- */
.ptile{border-radius:18px;overflow:hidden;margin:6px 0 14px;border:1px solid var(--line);background:var(--paper);box-shadow:0 2px 10px rgba(40,30,80,.08)}
.ptile .band{height:74px;background:var(--c,#8F7CE0);position:relative}
.ptile .band:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.18),transparent 55%,rgba(255,255,255,.18))}
.ptile .body{padding:12px 16px 14px;display:flex;align-items:baseline;justify-content:space-between}
.ptile .nm{font-size:20px;font-weight:800;letter-spacing:-.01em}
.ptile .tm{font-size:13px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.ptile .no{font-size:12px;color:var(--sub);margin-left:8px;font-weight:600}

/* ---- 채팅 ---- */
.divider{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--sub);font-size:12.5px;font-weight:700;letter-spacing:.04em}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.sys{text-align:center;font-size:13.5px;color:var(--sub);margin:14px 12px;line-height:1.7;text-wrap:balance}
.sys .ln{display:block}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin:12px 0}
.row{display:flex;gap:8px;align-items:flex-start;margin:12px 0}
.row .col{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.av{width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--avc,#B9B3CC);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.av svg{width:36px;height:36px;display:block}
.av.sysav{border-radius:10px}
.who{font-size:12.5px;color:var(--ink);margin:0 0 4px 6px;font-weight:700}
.b{background:var(--bub);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 18px 5px;
  padding:11px 15px;font-size:15.5px;max-width:86%;line-height:1.6;box-shadow:0 1px 3px rgba(40,30,80,.06);text-wrap:pretty}
.msg.me{align-items:flex-end}
.msg.me .who{margin:0 6px 4px 0;color:var(--accent)}
.msg.me .b{background:var(--me);color:#fff;border-color:var(--me);border-radius:18px 18px 5px 18px}
.b.push{padding:0;background:transparent;border:0;box-shadow:none;max-width:92%}
/* 링크 미리보기 타일: 위 썸네일(색 블록) + 아래 회색 정보 영역 */
.push{width:290px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 8px rgba(60,40,120,.08)}
.push .thumb{height:118px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff;
  background:linear-gradient(135deg,#3A3844 0%,#5B4FBB 60%,#8F7CE0 100%);position:relative}
.push .thumb:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,255,255,.18),transparent 45%)}
.push .big{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.push .meta{background:#EEEBF5;padding:10px 14px 11px}
.push .ttl{font-size:13.5px;font-weight:700;line-height:1.45;color:var(--ink)}
.push .src{font-size:11.5px;color:var(--sub);margin-top:5px;display:flex;align-items:center;gap:6px}
.push .src:before{content:"";width:12px;height:12px;border-radius:3px;background:var(--accent);opacity:.7;flex:0 0 auto}
.info{background:var(--lav);border-left:3px solid var(--accent);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;color:var(--ink)}

/* ---- 하단 시트 ---- */
button{font:inherit}
.ask{font-size:13px;color:var(--ink);margin:2px 4px 8px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15.5px;line-height:1.5;font-weight:500}
.opt:hover{border-color:var(--accent);background:var(--screen)}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;
  padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;margin-top:4px}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:600;margin-top:8px}
.btn.dark{background:var(--charcoal)}
.btn.inline{display:inline-block;width:auto;padding:10px 22px;font-size:14.5px;border-radius:12px;margin-top:6px}

/* ---- 카드 ---- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
h1{font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px}
.small{font-size:13px;color:var(--sub)}
.eyebrow{font-size:12px;color:var(--sub);letter-spacing:.06em;margin-bottom:8px}
.result{text-align:center;padding:24px 18px}
.result .emo{font-size:52px;line-height:1}
.result .nm{font-size:26px;font-weight:800;margin-top:6px}
.result .sb{font-size:14px;color:var(--sub)}
.result .desc{margin-top:14px;font-size:15.5px;text-align:left}
.hand{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;text-align:left;font-size:14px}
.hand b{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.reveal{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:14px 0}
.reveal .n{font-size:22px;font-weight:800;color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
  border-radius:12px;background:var(--paper);margin-bottom:7px;cursor:pointer;font-size:14.5px;line-height:1.55}
.chk input{margin:4px 0 0;width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent)}
.chk.on{border-color:var(--accent);background:var(--lav)}
.chk .ex{display:block;font-style:normal;font-size:12.5px;color:var(--sub);margin-top:3px}
.acro{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.acro:first-of-type{border-top:0}
.acro .h{font-size:23px;font-weight:800;color:var(--accent);width:26px;flex:0 0 auto;line-height:1.25}
.acro .t{font-size:15.5px;font-weight:500;color:var(--charcoal);line-height:1.55}
/* ---- 신호등 문항: 예 / 아니오 ---- */
.q{border:1px solid var(--line);border-radius:14px;padding:12px 13px 10px;margin-bottom:9px;background:var(--paper)}
.q.done{border-color:#CFC6E6;background:#FBFAFE}
.q .qt{font-size:14.5px;line-height:1.55;display:flex;gap:8px}
.q .qn{font-weight:800;color:var(--sub);flex:0 0 auto;font-variant-numeric:tabular-nums}
.q .ex{display:block;font-style:normal;font-size:12.5px;color:var(--sub);margin-top:4px}
.yn{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}
.ynb{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:11px;
  padding:7px 16px;font-size:14px;font-weight:700;cursor:pointer;min-width:64px}
.ynb:hover{border-color:var(--accent)}
.ynb.on{color:#fff;border-color:transparent}
.ynb.yes.on{background:var(--accent)}
.ynb.no.on{background:#8C8A9C}
.prog{font-size:13px;font-weight:700;color:var(--sub);margin:2px 4px 8px;display:flex;justify-content:space-between}
.btn[disabled]{opacity:.35;cursor:default}
/* ---- 결과: 나의 존중 ---- */
.tp{border-top:1px solid var(--line);padding:15px 0 4px}
.tp:first-of-type{border-top:0;padding-top:4px}
.tp .lb{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.03em}
.tp .v{display:flex;align-items:center;gap:11px;margin-top:8px}
.tp .e{font-size:32px;line-height:1}
.tp .n{font-size:19px;font-weight:800}
.tp .s{font-size:12.5px;color:var(--sub)}
.tp .gd{font-size:14px;line-height:1.6;margin-top:9px}
.grp{margin:18px 0 4px;font-weight:800;font-size:16px}
.grp small{display:block;font-weight:600;font-size:12px;color:var(--sub);margin-top:2px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media(max-width:400px){.dual{grid-template-columns:1fr}}
.dual>div{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper)}
.dual .lb{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.barrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.barrow .nm{width:52px;flex:0 0 auto}
.barrow .tr{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:99px}
.barrow .vv{width:22px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.note{background:var(--lav);border-radius:12px;padding:13px;font-size:14px;margin:12px 0}
.foot{text-align:center;margin:22px 0 10px;line-height:1.7}
.foot b{display:block;font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.foot span{display:block;font-size:12px;color:var(--sub)}
.foot .org{font-size:13px;font-weight:700;color:var(--charcoal);margin-top:6px}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="status">
      <span id="clock">&nbsp;</span>
      <span class="r">
        <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 11.2 6.1 9.3a2.7 2.7 0 0 1 3.8 0L8 11.2Zm-3.6-3.6-1.5-1.5a7.2 7.2 0 0 1 10.2 0l-1.5 1.5a5.1 5.1 0 0 0-7.2 0ZM1.4 4.1 0 2.7a11.3 11.3 0 0 1 16 0l-1.4 1.4a9.3 9.3 0 0 0-13.2 0Z" fill="currentColor"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="view" id="log"></div>
    <div class="sheet" id="sheet"></div>
    <div class="home"></div>
  </div>
</div>

<script>
/* ==========================================================================
   DATA — 모든 문안은 이 블록에서만 수정한다.
   유형 체계는 청소년판(quiz-talk)과 동일: 지지 · 사고 · 행동 · 관찰
   반응(r)은 "화자: 말" 형식이면 말풍선, 아니면 상황 서술로 표시된다.
   ========================================================================== */
const T = {

    desc:'오늘 당신은 사람 쪽으로 먼저 움직였다. 사정을 묻고, 편을 들고, 분위기를 눅였다.',
    hand:'사정을 묻는 한마디가 상대의 부담을 덜어 줍니다.'},

    hand:'감정만 말하기보다 사실을 함께 말하면 요구가 분명해집니다.'},

    hand:'말로 하기 어려울 때는 행동으로 대신할 수 있습니다.'},
  gwan : {key:'gwan', emo:'🌙', nm:'관찰형', sub:'조용한 스캐너', color:'var(--t-gwan)',
    desc:'오늘 당신은 한 발 뒤에서 지켜봤다. 나서지 않았지만, 놓치지도 않았다.',

const ORDER = ['jiji','sago','haeng','gwan'];

/* ===== 결과 수집 (익명 집계) =====
   구글시트 Apps Script 웹앱 URL을 여기에 넣으면 최종 유형만 익명으로 전송된다.
   비워 두면 아무것도 전송하지 않는다(무저장 모드). */
const COLLECT = { url:'https://script.google.com/macros/s/AKfycbyMboO82TEI8Z3ygbECRrKMsaafeaiGWSMZANheUZ1o_yF-dmJ3ALA4d2GXqrmaMeDSww/exec' };

const PLACE_COLORS={'출근길':'#B9B3CC','사무실':'#8F7CE0','점심':'#D2A24C','식당':'#D2A24C','주민센터':'#6FB08C','집':'#C9A7E8','편의점':'#E08A6A'};

/* 지식 관문: 동료와의 채팅. 오답이면 되묻고, 정답 뒤에는 현실 이야기(beat)가 한 번 더 이어진다. beat의 선택은 채점하지 않는다. */

 {t:'intro'},

  good:'그러네. 법에 있는 거였네.',
  info:'고객응대근로자 보호는 사업주의 법적 의무다. 응대 중단·전환, 고소 지원까지 포함된다.',
  beat:'근데 법에 있으면 뭐 해. 끊으면 그 전화 다른 사람이 받아야 하는데. 우리 팀도 그렇잖아.',

        {sys:'통화가 끊기고, 동료는 화면만 본다. 2시 반차다. 오전만 버티면 된다.'}],
  picks:[
   {ask:'나는', opts:[
     {k:'jiji', s:'"그 사람 원래 그래요. 수고했어요."', r:'동료: …네.'},
     {k:'sago', s:'"그 정도면 폭언이에요. 기록 남겨요."', r:'동료: 아, 그런 게 있어요? …근데 끊으면 그 전화 옆자리가 받잖아요.'},

const TOTAL_PICKS=9; let donePicks=0;
const SCENES=STEPS.filter(s=>s.t==='scene').length;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function setTop(time,place){
  clockEl.innerHTML=time||'&nbsp;'; progEl.style.width=(donePicks/TOTAL_PICKS*100)+'%';
}
function push(html){ const d=document.createElement('div'); d.innerHTML=html; while(d.firstChild) log.appendChild(d.firstChild); log.scrollTop=log.scrollHeight; }
function setSheet(html){ sheet.innerHTML=html||''; log.scrollTop=log.scrollHeight; }
function clearLog(){ log.innerHTML=''; }
function sys(s){ const parts=String(s).split(/(?<=[.!?])\s+(?=\S)/); return `<div class="sys">${parts.map(x=>`<span class="ln">${esc(x)}</span>`).join('')}</div>`; }
/* 화자별 아바타 — 같은 사람은 어디서나 같은 색·얼굴. 동료는 한 명(옆자리, 폭언 전화를 받은 그 사람). */
const AV={
  '동료':{c:'#8F7CE0'}, '팀장':{c:'#5C5A6E'}, '창구 직원':{c:'#6FB08C'}, '상담원':{c:'#C9A7E8'},
  '알바생':{c:'#E08A6A'}, '앞 손님':{c:'#A39FB5'}, '앞 민원인':{c:'#A39FB5'}, '직원':{c:'#D2A24C'},
  '안내 멘트':{c:'#3A3844',sys:'☏'}, '배달앱':{c:'#3A3844',sys:'▣'}
};
function face(){ return `<svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="14" r="6.2" fill="#fff" opacity=".92"/><path d="M6.5 32c1.3-6.4 6-9.6 11.5-9.6S28.2 25.6 29.5 32Z" fill="#fff" opacity=".92"/></svg>`; }
function avatar(who){ const a=AV[who]||{c:'#B9B3CC'};
  return a.sys?`<span class="av sysav" style="--avc:${a.c};color:#fff;font-size:16px">${a.sys}</span>`:`<span class="av" style="--avc:${a.c}">${face()}</span>`; }
function bub(who,s,me){ return `<div class="msg${me?' me':''}"><span class="who">${esc(who)}</span><span class="b">${esc(s)}</span></div>`; }
function me(s){ return bub('나',s,true); }
function react(r){ const m=r.match(/^([^:：]{1,12})[:：]\s*(.+)$/); return m?bub(m[1],m[2]):sys(r); }
function leadHTML(lead){ return lead.map(l=>l.sys?sys(l.sys):bub(l.w,l.s)).join(''); }
function sceneNo(){ return STEPS.slice(0,si+1).filter(s=>s.t==='scene').length; }
let lastPlace=null;
function placeTile(st){
  return `<div class="loc" style="margin:4px 0 14px"><span class="n"><i class="dot" style="background:${PLACE_COLORS[st.place]||'#8F7CE0'}"></i>${esc(st.place)}${st.t==='scene'?`<span class="no">${sceneNo()}/${SCENES}</span>`:''}</span><span class="t">${esc(st.time)}</span></div>`;
}
/* 관문·장면마다 새 대화방: 로그 비우고 장소 타일(장소·시각)로 시작. 한 장면 안의 대화는 이어진다. */
function enter(st){ clearLog(); lastPlace=st.place; return placeTile(st); }
function optsHTML(ask,opts,fn){ // fn(name) : global handler name, index passed
  return `<div class="ask">${esc(ask)}</div>`+opts.map((o,i)=>`<button class="opt" onclick="${fn}(${i})">${esc(o.s)}</button>`).join('');
}

function render(){
  const st=STEPS[si];
  if(st.t==='intro') return renderIntro();
  if(st.t==='gate') return renderGate(st);
  if(st.t==='scene') return renderScene(st);
  if(st.t==='end') return renderEnd();
}

/* ---------- 시작 ---------- */
function renderIntro(){
  setTop('',null);
  push(`<div class="card" style="margin-top:8px">
    <div class="eyebrow">존중시민 · 성인</div>
    <h1>오후 반차</h1>
    <p class="small" style="margin-bottom:16px">반차를 낸 오후, 여섯 번의 마주침</p>
    <p>집 인터넷이 사흘째 불안정하다. 사무실에서 몇 번 전화했지만 대기가 길어 매번 끊었다.</p>
    <p>오늘은 2시부터 오후 반차다. 주민센터에 들르고, 3시 반 병원 예약을 다녀오고, 인터넷 문제를 마무리할 생각이다.</p>
    ${COLLECT.url?'<p class="small" style="margin-bottom:14px">선택 과정은 저장하지 않습니다. 마지막 유형 결과만 익명으로 집계됩니다.</p>':''}
    <button class="btn inline" onclick="si++;render()">시작 →</button>
  </div>
  <div class="foot"><b>존중시민</b><span>감정노동 존중 『부천시민다움』</span><span class="org">부천시일쉼지원센터</span></div>`);
  setSheet('');
}

/* ---------- 지식 관문 (동료와의 채팅) ---------- */
let G=null, gRetried=false, gOpts=[];
function renderGate(st){
  G=st; gRetried=false; setTop(st.time, st.place);
  push(enter(st)+leadHTML(st.lead)
    +`<div class="msg"><span class="who">${esc(st.who)}</span><span class="b push"><div class="push">
       <div class="thumb"><div class="big">${esc(st.news.big)}</div></div>
       <div class="meta"><div class="ttl">${esc(st.news.ttl)}</div><div class="src">${esc(st.news.app)} · ${esc(st.news.src)}</div></div></div></span></div>`
    +bub(st.who, st.q));
  gOpts=st.opts; setSheet(optsHTML('답장', gOpts, 'gAnswer'));
}
function gAnswer(i){
  const o=gOpts[i]; push(me(o.s));
  if(!o.ok && !gRetried){
    gRetried=true;
    push(bub(G.who, G.wrong)+bub(G.who, G.retry.q));
    gOpts=G.retry.opts; setSheet(optsHTML('답장', gOpts, 'gAnswer')); return;
  }
  push(bub(G.who, G.good)+`<div class="info">${esc(G.info)}</div>`+bub(G.who, G.beat));
  gOpts=G.beatOpts; setSheet(optsHTML('답장', gOpts, 'gBeat'));
}
function gBeat(i){
  const o=gOpts[i]; push(me(o.s)+bub(G.who, o.r));
  setSheet(`<button class="btn" onclick="si++;render()">계속</button>`);
}

/* ---------- 장면 ---------- */
let pOpts=[];
function renderScene(st){
  pi=0; setTop(st.time, st.place);
  push(enter(st)+leadHTML(st.lead));
  setSheet(`<button class="btn" onclick="renderPick()">계속</button>`);
}
function renderPick(){
  const st=STEPS[si], p=st.picks[pi];
  if(p.pre && !p._shown){ p._shown=true; push(leadHTML(p.pre)); }
  pOpts=shuffle(p.opts);
  setSheet(optsHTML(p.ask, pOpts, 'pAnswer'));
}
function pAnswer(i){
  const st=STEPS[si], o=pOpts[i];
  tally[o.k]++; donePicks++; setTop(st.time, st.place);
  const last=(pi===st.picks.length-1);
  push(me(o.s)+react(o.r)+(last&&st.out?sys(st.out):''));
  if(last) setSheet(`<button class="btn" onclick="si++;render()">계속</button>`);
  else { pi++; setSheet(`<button class="btn" onclick="renderPick()">계속</button>`); }
}

/* ---------- 엔딩 · 판정 ---------- */
function renderEnd(){
  setTop('',null);
  const max=Math.max(...ORDER.map(k=>tally[k]));
  const tied=ORDER.filter(k=>tally[k]===max);
  if(tied.length>1&&!gameType){
    push(`<div class="card"><h2>두 유형이 같은 수로 나왔습니다</h2><p class="small" style="margin:0">더 나답다고 느끼는 쪽을 고르시면 됩니다. 우열은 없습니다.</p></div>`);
    setSheet(tied.map(k=>`<button class="opt" onclick="gameType='${k}';renderResult()">${T[k].emo} <b>${T[k].nm}</b> — ${T[k].sub}</button>`).join(''));
    return;
  }
  if(!gameType) gameType=tied[0];
  renderResult();
}
function renderResult(){
  const t=T[gameType]; clearLog(); lastPlace=null; sendResult(false);
  push(`<div class="divider"><span>오늘 나는 어떤 존중시민이었나</span></div>
  <div class="card result">
    <div class="emo">${t.emo}</div>
    <div class="nm" style="color:${t.color}">${t.nm}</div>
    <div class="sb">${t.sub}</div>
    <p class="desc">${esc(t.desc)}</p>
    <div class="hand"><b>다른 유형에게 건네는 말</b>${esc(t.hand)}</div>
  </div>
  <div class="note"><b>존중시민</b>은 ${esc(DEF.citizen)}입니다.
    오늘 당신이 감정노동자를 만난 방식은 <b>${t.nm}</b>입니다.</div>`
  +ENDING.lead.map(sys).join(''));
  setSheet(`<button class="btn" onclick="renderReveal()">조사 결과 보기</button>`);
}
function renderReveal(){
  const r=ENDING.reveal;
  push(`<div class="card" style="margin:8px 0"><div class="reveal" style="margin:0">
      <div class="n">${esc(r.n)}</div><div style="font-weight:700;font-size:14px">${esc(r.h)}</div>
      <p style="margin:6px 0 4px">${esc(r.b)}</p><p class="small" style="margin:0">${esc(r.s)}</p></div></div>
    <div class="card"><h2>한 번 더 점검해 볼까요</h2>
      <p style="margin:0">방금 나온 유형은 <b>오늘 하루</b>의 대응입니다. 존중 신호등은 <b>최근 3개월</b>의 나를 봅니다. 둘은 다를 수 있습니다.</p></div>`);
  setSheet(`<button class="btn" onclick="renderCheck()">감정노동 존중 신호등 테스트</button><button class="btn ghost" onclick="renderBye()">여기서 마치기</button>`);
}

/* ---------- 결과 전송 (익명) ---------- */
const RID='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function sendResult(done){
  if(!COLLECT.url||!gameType) return;
  const n=SIGNAL.items.reduce((a,_,i)=>a+(chk[i]===true?1:0),0);
  const a_=SIGNAL.items.reduce((a,_,i)=>a+(chk[i]===undefined?0:1),0);
  const full=(a_===SIGNAL.items.length);
  const payload={id:RID,type:gameType,typeName:T[gameType].nm,
    grade:full?gradeOf(n).nm:'',yes:full?n:'',done:!!(done&&full)};
  try{
    fetch(COLLECT.url,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)});
  }catch(err){}
}

/* ---------- 감정노동 존중 신호등 테스트 (별도 페이지) ---------- */
function renderCheck(){
  setTop('',null); clearLog();
  chk={};
  let html=`<div class="card" style="margin-top:8px"><div class="eyebrow">추가 섹션 · 부천시민다움 체크리스트</div>
    <h2>감정노동 존중 신호등 테스트</h2>
    <p class="small" style="margin:0">${esc(SIGNAL.guide)}</p></div><div class="card">`;
  SIGNAL.items.forEach((it,i)=>{
    html+=`<div class="q" id="sg-${i}">
      <div class="qt"><span class="qn">${i+1}</span><span>${esc(it.s)}${it.ex?`<em class="ex">${esc(it.ex)}</em>`:''}</span></div>
      <div class="yn">
        <button class="ynb yes" id="y-${i}" onclick="tick(${i},1)">예</button>
        <button class="ynb no" id="n-${i}" onclick="tick(${i},0)">아니오</button>
      </div></div>`;
  });
  html+=`</div>`;
  push(html);
  drawSheet();
  log.scrollTop=0;
}
function answered(){ return SIGNAL.items.reduce((a,_,i)=>a+(chk[i]===undefined?0:1),0); }
function drawSheet(){
  const a=answered(), all=SIGNAL.items.length, keep=log.scrollTop;   /* 보던 위치를 그대로 둔다 */
  setSheet(`<div class="prog"><span>응답 ${a} / ${all}</span><span>${a<all?'남은 문항 '+(all-a)+'개':'모두 응답했습니다'}</span></div>
    <button class="btn" ${a<all?'disabled':''} onclick="${a<all?'':'renderDual()'}">결과 보기</button>`);
  log.scrollTop=keep;
}
function tick(i,v){
  chk[i]=!!v;
  document.getElementById('y-'+i).classList.toggle('on',!!v);
  document.getElementById('n-'+i).classList.toggle('on',!v);
  document.getElementById('sg-'+i).classList.add('done');
  drawSheet();   /* 자동 스크롤 없음 — 참여자가 직접 내리면서 답한다 */
}
function gradeOf(n){ return SIGNAL.grades.find(g=>n<=g.max)||SIGNAL.grades[SIGNAL.grades.length-1]; }

function renderDual(){
  clearLog();
  const n=SIGNAL.items.reduce((a,_,i)=>a+(chk[i]?1:0),0);
  const g=gradeOf(n), gt=T[gameType];
  const tie = n===0
    ? `오늘 당신은 <b>${gt.nm}</b>으로 감정노동자를 만났습니다. 최근 3개월 동안 해당하는 행동도 없었습니다. 지금처럼 하시면 됩니다.`
    : n<=3
    ? `오늘 당신은 <b>${gt.nm}</b>으로 감정노동자를 만났습니다. 다만 최근 3개월 동안 해당하는 행동이 <b>${n}가지</b> 있었습니다. 그 ${n}가지를 줄이는 것이 다음 과제입니다.`
    : `오늘 당신은 <b>${gt.nm}</b>으로 감정노동자를 만났습니다. 다만 최근 3개월 동안 해당하는 행동이 <b>${n}가지</b> 있었습니다. 오늘 하루의 대응보다 반복되는 행동이 상대에게 더 큰 영향을 줍니다.`;
  push(`<div class="card" style="margin-top:8px">
    <div class="eyebrow">존중시민 결과</div><h2 style="margin-bottom:4px">나의 존중</h2>
    <p class="small" style="margin-bottom:10px">오늘 하루의 대응과 최근 3개월의 행동을 함께 봅니다.</p>
    <div class="tp"><div class="lb">오늘 — 감정노동자를 대한 방식</div>
      <div class="v"><span class="e">${gt.emo}</span><span><span class="n" style="color:${gt.color}">${gt.nm}</span><br><span class="s">${gt.sub}</span></span></div></div>
    <div class="tp"><div class="lb">지난 3개월 — 나의 존중 신호</div>
      <div class="v"><span class="e">${g.emo}</span><span><span class="n" style="color:${g.color}">${g.nm}</span><br><span class="s">10문항 중 "예" ${n}개</span></span></div>
      <div class="gd">${esc(g.d)}</div></div>
    <div class="note">${tie}</div>
    <p class="small" style="margin:10px 0 0">네 유형에는 우열이 없습니다. 신호등 등급에는 높고 낮음이 있습니다. 유형은 <b>어떻게</b> 대했는지를, 신호등은 <b>무엇을</b> 했는지를 보여 줍니다.</p>
  </div>
  <div class="card"><div class="eyebrow">${esc(SIGNAL.slogan.sub)}</div>
    <h2 style="margin-bottom:12px">${esc(SIGNAL.slogan.title)}</h2>
    ${SIGNAL.slogan.lines.map(l=>`<div class="acro"><span class="h">${esc(l.h)}</span><span class="t">${esc(l.t)}</span></div>`).join('')}
  </div>`);
  setSheet(`<button class="btn" onclick="renderBye(true)">마치기</button>`);
  log.scrollTop=0;
  sendResult(true);
}

function renderBye(withSignal){
  clearLog(); const gt=T[gameType];
  const n=SIGNAL.items.reduce((a,_,i)=>a+(chk[i]?1:0),0), g=gradeOf(n);
  push(`<div class="card result" style="margin-top:8px">
    <div class="emo">${gt.emo}</div><div class="nm" style="color:${gt.color}">${gt.nm}</div><div class="sb">오늘의 존중시민</div>
    ${withSignal?`<div class="hand"><b>나의 존중 신호등 (최근 3개월)</b>${g.emo} ${esc(g.nm)} · 10문항 중 "예" ${n}개</div>`:''}
    <div class="hand"><b>부천시민다움</b>${esc(DEF.buchoen)}</div>
  </div>`);
  setSheet(`<button class="btn dark" onclick="location.reload()">처음부터 다시</button>`);
}

render();
</script>
</body>
</html>
